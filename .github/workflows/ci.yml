name: ci

on:
  push:
    paths:
      - "src/**"
      - "pbt/**"
      - "build.rs"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"

env:
  OPENH264_VERSION: "2.6.0"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - windows-2025
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable
      - name: Install libclang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y
      - run: cargo fmt --all --check
      - run: cargo check --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - windows-2025
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable
      - name: Install libclang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y
      - name: Download OpenH264
        id: openh264
        uses: shiguredo/github-actions/.github/actions/download-openh264@main
        with:
          openh264_version: ${{ env.OPENH264_VERSION }}
          use-cache: "true"
      - name: Run tests
        shell: bash
        env:
          OPENH264_PATH: ${{ steps.openh264.outputs.openh264_path }}
        run: cargo test --workspace
